name: TheValorSMP
version: '${version}'
main: net.thevalorsmp.core.ValorPlugin
api-version: '1.21'
description: The Valor SMP gameplay platform.
website: https://thevalorsmp.net
authors:
  - The Valor SMP team
folia-supported: false
# Resolved from Maven Central by Paper's library loader on startup, keeping them out of the plugin JAR.
libraries:
  - com.zaxxer:HikariCP:${hikariVersion}
  - org.xerial:sqlite-jdbc:${sqliteVersion}
  - org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}
commands:
  valor:
    description: Show your current Valor score and tier.
    usage: /valor
    permission: valorsmp.valor.view
  speed:
    description: Switch your permanent Valor speed between Speed I and II (Valor IV+).
    usage: /speed set <1|2>
    permission: valorsmp.speed.use
  valorsmp:
    description: Valor SMP operator diagnostics.
    usage: /valorsmp <health|version|reload|valor>
    permission: valorsmp.admin
permissions:
  valorsmp.valor.view:
    description: Allows using /valor to view your own Valor score.
    default: true
  valorsmp.speed.use:
    description: Allows using /speed. Actual effect is gated further by the player's Valor tier.
    default: true
  valorsmp.admin:
    description: Valor SMP operator commands.
    default: op
