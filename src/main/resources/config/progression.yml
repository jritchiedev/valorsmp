# Valor progression (docs/progression.md, docs/valor-system.md).
progression:
  # Current season; Valor scores are keyed by (uuid, season). Bump at a season reset.
  current-season: 1
  # Minimum Valor Points required to reach each tier I..V. Must be 5 ascending, non-negative values.
  tier-thresholds: [0, 5, 9, 13, 17]
  # Valor scores never exceed this value.
  max-valor: 20
  # Whether Valor II+ extends potion effect durations.
  extended-potion-effects: true
  # Source potion duration (ticks) -> extended duration (ticks) for Valor II+ players.
  # 9600 = 8:00 -> 12000 = 10:00; 1800 = 1:30 -> 3600 = 3:00 (docs/progression.md).
  potion-duration-extensions:
    "9600": 12000
    "1800": 3600
