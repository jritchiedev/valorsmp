name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # `check` runs compileJava, compileTestJava, Checkstyle, unit tests and integration tests.
      - name: Check
        run: ./gradlew check

      - name: Build plugin JAR
        run: ./gradlew build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/
          if-no-files-found: ignore

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: the-valor-smp-jar
          path: build/libs/*.jar
